<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241e19">
  <meta name="description" content="The index of every electricfieldon piece: search for a line, or browse by chapter, language and form.">
  <title>Index — electricfieldon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Tiro+Devanagari+Hindi&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script defer src="site-config.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body data-page="index">
  <a class="skip" href="#main">Skip to the index</a>
  <header class="bookbar">
    <a class="mark" href="index.html#contents" data-site-name>electricfieldon</a>
    <nav class="bookbar-nav" aria-label="Book">
      <a href="index.html#contents" data-nav="contents">Contents</a>
      <a href="archive.html" data-nav="index" aria-current="page">Index</a>
      <a href="https://www.instagram.com/electricfieldon/" data-instagram-link class="bookbar-ig">Instagram</a>
    </nav>
  </header>

  <main id="main" class="book">
    <div class="page page-single index-page">
      <p class="page-head" data-site-name>electricfieldon</p>
      <h1 class="index-title">Index</h1>
      <p class="index-intro">Every piece in the book. Search for a line you remember, or narrow it down.</p>

      <div class="index-tools">
        <label class="search"><span class="vh">Search the index</span><input id="search" type="search" placeholder="Search for a line, a word, a page…" autocomplete="off"></label>
        <div class="chips" id="chapter-chips" role="group" aria-label="Chapter"></div>
        <div class="index-filters">
          <label><span>Language</span><select id="filter-language"><option value="">Any</option></select></label>
          <label><span>Form</span><select id="filter-type"><option value="">Any</option></select></label>
          <label><span>Pages</span><select id="filter-format"><option value="">Any</option><option value="single">Single page</option><option value="carousel">Several pages</option></select></label>
          <label><span>Order</span><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
          <button class="link-button" id="clear-filters" type="button">Clear</button>
        </div>
      </div>

      <p class="index-count" id="results-count" aria-live="polite"></p>
      <div class="index-list" id="index-list"></div>
      <div class="empty-state" id="empty-state" hidden>
        <p>Nothing in the index matches that.</p>
        <button class="link-button" id="empty-clear" type="button">Clear the search and filters</button>
      </div>
    </div>
  </main>

  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
    <button class="reader-backdrop" type="button" data-close-reader tabindex="-1" aria-label="Close"></button>
    <article class="reader-book">
      <div class="reader-page reader-art">
        <button class="reader-x" type="button" data-close-reader aria-label="Close">×</button>
        <img id="reader-image" alt="">
        <button class="slide-btn slide-prev" id="slide-prev" type="button" aria-label="Previous image">‹</button>
        <button class="slide-btn slide-next" id="slide-next" type="button" aria-label="Next image">›</button>
        <span class="slide-count" id="slide-count"></span>
      </div>
      <div class="reader-page reader-text">
        <div class="reader-top"><span id="reader-context"></span><button class="reader-close" type="button" data-close-reader>Close</button></div>
        <p class="reader-folio" id="reader-folio"></p>
        <h2 id="reader-title"></h2>
        <p class="reader-date" id="reader-date"></p>
        <div class="reader-caption" id="reader-caption"></div>
        <p class="reader-tags" id="reader-tags"></p>
        <div class="reader-actions">
          <button class="text-button" id="copy-caption" type="button">Copy caption</button>
          <button class="text-button" id="copy-link" type="button">Copy link</button>
          <a class="text-button" id="reader-instagram" href="https://www.instagram.com/electricfieldon/" target="_blank" rel="noreferrer">View on Instagram</a>
        </div>
        <nav class="reader-turn" aria-label="Turn the page">
          <button class="turn-button" id="prev-piece" type="button">‹ Previous page</button>
          <span class="reader-pos" id="reader-pos"></span>
          <button class="turn-button" id="next-piece" type="button">Next page ›</button>
        </nav>
      </div>
    </article>
  </div>
</body>
</html>
